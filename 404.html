<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Wario Bross</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://i.postimg.cc/NFngwPzn/Logo-Wario-Bross.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --color-fondo:#0d1620; --color-superficie:#16222f; --color-borde:#233347;
    --color-acento:#f6b73c; --color-acento-2:#ff7a3d; --color-texto:#f7f3ea; --color-texto-sutil:#aebccb;
    --fuente-display:'Bangers','Arial Black',sans-serif; --fuente-cuerpo:'Inter',sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--color-fondo); color:var(--color-texto); font-family:var(--fuente-cuerpo);
    min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
  }
  .caja{ max-width:420px; }
  img{ width:96px; height:96px; border-radius:20px; margin:0 auto 20px; object-fit:cover; }
  h1{ font-family:var(--fuente-display); font-size:64px; color:var(--color-acento); letter-spacing:1px; text-shadow:2px 2px 0 rgba(0,0,0,.4); }
  p{ color:var(--color-texto-sutil); margin:14px 0 28px; font-size:15px; line-height:1.5; }
  .botones{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  a.btn{
    display:inline-block; padding:13px 22px; border-radius:999px; font-weight:800; font-size:14px;
    text-decoration:none;
  }
  .btn-primario{ background:var(--color-acento-2); color:#1a1306; }
  .btn-secundario{ background:transparent; border:1.5px solid var(--color-acento); color:var(--color-acento); }
</style>
</head>
<body>
  <div class="caja">
    <img src="https://i.postimg.cc/NFngwPzn/Logo-Wario-Bross.png" alt="Wario Bross">
    <h1>404</h1>
    <p>Esta página se la comió alguien antes que tú. Pero el menú sigue completo.</p>
    <div class="botones">
      <a class="btn btn-secundario" href="/">Inicio</a>
      <a class="btn btn-secundario" href="/#menu">Ver menú</a>
      <a class="btn btn-primario" href="https://menu.fu.do/wariobross" target="_blank" rel="noopener">🍔 Pedir ahora</a>
    </div>
  </div>
</body>
</html>
